name: Build Aplikasi PC (Windows)
on:
  push:
    tags: ['pc-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Salin tampilan web ke aplikasi PC
        shell: bash
        run: |
          mkdir -p desktop/app
          cp web/index.html web/firebase-config.js desktop/app/
      - name: Pasang dan bangun
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: KKN-PC-Windows
          path: desktop/dist/*.exe
      - name: Lampirkan ke Release
        if: startsWith(github.ref, 'refs/tags/pc-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" desktop/dist/*.exe --title "Aplikasi PC ${GITHUB_REF_NAME}" --notes "Aplikasi PC KKN Al-Mushlih 2027 untuk Windows." || gh release upload "${GITHUB_REF_NAME}" desktop/dist/*.exe --clobber
