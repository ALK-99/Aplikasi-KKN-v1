name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_RILIS: ALK-99/Download-Aplikasi-KKN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Siapkan google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::google-services.json belum ada"
          fi

      - name: Tentukan versi
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK rilis
        run: gradle assembleRelease -PappVersionName=${{ steps.ver.outputs.name }} -PappVersionCode=${{ github.run_number }} --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk SekretarisKKN-v${{ steps.ver.outputs.name }}.apk

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SekretarisKKN-apk
          path: SekretarisKKN-v${{ steps.ver.outputs.name }}.apk

      - name: Rilis di repo ini (arsip, dan jalur update lama selama masa transisi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SekretarisKKN-v${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true

      - name: Rilis di repo publik (unduhan dan update untuk pengguna)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.REPO_RILIS }}
          token: ${{ secrets.RILIS_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Versi ${{ steps.ver.outputs.name }}"
          files: SekretarisKKN-v${{ steps.ver.outputs.name }}.apk
