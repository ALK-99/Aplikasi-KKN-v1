name: Cek Kompilasi

# Memeriksa kode setiap push ke main supaya error ketahuan sebelum membuat rilis.
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  workflow_dispatch:

jobs:
  kompilasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Siapkan google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > app/google-services.json; fi
      - name: Kompilasi Kotlin
        run: gradle :app:compileReleaseKotlin --no-daemon
