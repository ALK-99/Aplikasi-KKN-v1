:root{--bg:#fbfcff;--s1:#fbfcff;--s2:#eef2fb;--tx:#1b2240;--soft:#464f70;--mut:#646e8c;--vio:#1d3f9c;--vio2:#4a6fd0;--gold:#8a5a00;--mint:#0b7a4e;--red:#c42f2f;--pink:#d9443b;--line:#d3dcf0;--hi:#ffe66b;--hiink:#1b2240;--bt:#fff;--sh:none;--font:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
html[data-tema=gelap]{--bg:#16211f;--s1:#16211f;--s2:#1f2d2a;--tx:#edf3ee;--soft:#c5d2c9;--mut:#9fb0a6;--vio:#8fb0ff;--vio2:#b4c9ff;--gold:#f0c75a;--mint:#6fdba8;--red:#ff8d84;--pink:#ff8a7a;--line:#2f413d;--hi:#e9d56a;--hiink:#1b2240;--bt:#16211f}
@media (prefers-color-scheme:dark){html[data-tema=auto]{--bg:#16211f;--s1:#16211f;--s2:#1f2d2a;--tx:#edf3ee;--soft:#c5d2c9;--mut:#9fb0a6;--vio:#8fb0ff;--vio2:#b4c9ff;--gold:#f0c75a;--mint:#6fdba8;--red:#ff8d84;--pink:#ff8a7a;--line:#2f413d;--hi:#e9d56a;--hiink:#1b2240;--bt:#16211f}}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14.5px/1.5 var(--font);background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font);letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:1.5px solid var(--vio);border-radius:3px;padding:8px 16px;background:var(--vio);color:var(--bt);font-weight:700;transition:background .12s,color .12s}
button:hover{background:var(--tx);border-color:var(--tx);color:var(--bg)}button:active{transform:translateY(1px)}
button:focus-visible,.mn:focus-visible,.chip:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.sek{background:transparent;color:var(--vio);border-color:var(--vio)}button.sek:hover{background:var(--hi);color:var(--hiink);border-color:var(--tx)}
button.bahaya{background:transparent;border-color:transparent;color:var(--red);padding:6px 8px;text-decoration:underline;text-underline-offset:3px}button.bahaya:hover{background:transparent;color:var(--red);text-decoration-thickness:2px}
button.kecil{padding:4px 10px;font-size:12.5px}
input,select,textarea{font:inherit;padding:8px 2px 6px;border:0;border-bottom:1.5px solid var(--tx);border-radius:0;background:transparent;color:var(--tx);width:100%}
textarea{padding:8px 10px;border:1.5px solid var(--line);border-bottom-color:var(--tx);background:var(--s2)}
input:focus,select:focus,textarea:focus{outline:0;background:color-mix(in srgb,var(--hi) 32%,transparent);border-bottom-color:var(--vio)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--vio)}
input[type=file]{border-bottom-style:dashed}
label{display:block;font-size:12.5px;color:var(--soft);margin:12px 0 2px;font-weight:700}
#login,#setup{max-width:430px;margin:9vh auto;padding:6px 0 6px 30px;border-left:3px solid var(--pink);background:transparent}
#setup{max-width:600px}
#login h2{font-size:34px;line-height:1.05;font-weight:800;margin:10px 0 6px!important}
.logo{font-weight:800;font-size:15px;color:var(--hiink);background:var(--hi);display:inline-block;padding:2px 10px;border-radius:2px;line-height:1.5}
.shell{display:grid;grid-template-columns:236px 1fr;height:100vh}
aside{background:var(--s2);border-right:1.5px solid var(--tx);display:flex;flex-direction:column;overflow:auto;padding-bottom:6px}
.brand{display:block;padding:22px 18px 10px}.brand .logo{display:none}.brand b{display:block;font-size:21px;line-height:1.1;font-weight:800;letter-spacing:-.02em}.brand small{color:var(--mut);display:block;margin-top:3px}
.grp{margin:16px 18px 3px;padding-bottom:2px;border-bottom:1px solid var(--line);color:var(--vio);font-size:12.5px;font-weight:800}
.mn{display:block;width:100%;margin:0;padding:5px 18px;background:transparent;color:var(--soft);border:0;border-radius:0;text-align:left;font-weight:500;font-size:14px}
.mn:hover{background:transparent;color:var(--tx);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.mn.on{background:var(--hi);color:var(--hiink);font-weight:700}.mn.off{opacity:.5;cursor:default}.mn.off:hover{text-decoration:none}
.seg{font-size:11px;color:var(--mut);margin-left:6px;font-weight:500}
.kanan{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;gap:18px;align-items:flex-end;padding:24px 30px 10px 76px}
.top h1{margin:0;font-size:36px;line-height:1.05;font-weight:800;flex:1;letter-spacing:-.025em}.top input{max-width:270px}
main{padding:12px 30px 70px 76px;overflow:auto;flex:1;background:linear-gradient(90deg,transparent 54px,var(--pink) 54px,var(--pink) 56px,transparent 56px) local no-repeat}
main h3{font-size:17px;font-weight:800;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 28px;margin:4px 0 8px;border-top:2px solid var(--tx)}
.k{padding:12px 0 12px;border-bottom:1px solid var(--line)}
.k b{display:block;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}.k span{color:var(--soft);font-size:13px}
.hero{margin:0 0 20px;padding:0}
.hero h2{margin:0 0 2px;font-size:24px;font-weight:800}.hero p{margin:0;color:var(--soft)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.bar input,.bar select{width:auto;flex:1;min-width:180px;max-width:340px}.bar .sp{flex:1}
.tag{display:inline-block;padding:1px 8px;border-radius:2px;background:var(--s2);font-size:12.5px;color:var(--soft);font-weight:700}
.tag.ok{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}.tag.warn{background:var(--hi);color:var(--hiink)}.tag.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.wrap{overflow:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
th{border-bottom:2px solid var(--tx);color:var(--tx);font-size:12.5px;font-weight:800;white-space:nowrap}tr:last-child td{border-bottom:1px solid var(--line)}
tbody tr:hover{background:color-mix(in srgb,var(--hi) 28%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px 30px}
.card{padding:12px 0 14px;border-top:2px solid var(--tx)}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:3px 0;color:var(--soft)}
.bg{height:6px;background:var(--s2);border-radius:0;overflow:hidden}.bg i{display:block;height:100%;background:var(--vio)}
.kosong{padding:34px 0;color:var(--mut);font-size:15px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--tx) 48%,transparent);display:grid;place-items:center;z-index:20;padding:20px}
.dlg{background:var(--bg);border-radius:3px;padding:24px 26px 22px 30px;width:min(640px,100%);max-height:90vh;overflow:auto;border:2px solid var(--tx);border-left:3px solid var(--pink)}
.dlg h2{margin:0 0 6px;font-weight:800}.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.foto{width:100%;max-height:220px;object-fit:cover;border-radius:2px;margin-top:8px;cursor:zoom-in}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:2px;cursor:zoom-in}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:3px;border-bottom:3px solid var(--hi);font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:4px 12px;border-radius:2px;background:transparent;color:var(--soft);font-weight:600;cursor:pointer;border:1.5px solid var(--line)}.chip:hover{background:transparent;color:var(--tx);border-color:var(--tx)}.chip.on{background:var(--hi);color:var(--hiink);border-color:var(--tx)}
.sholat{display:grid;grid-template-columns:repeat(5,1fr);gap:0 14px;margin-top:14px;border-top:2px solid var(--tx)}.sholat div{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);color:var(--soft)}.sholat b{display:block;font-size:20px;font-weight:800;color:var(--tx)}
.sholat div.nx{background:var(--hi);color:var(--hiink);padding-left:8px}.sholat div.nx b{color:var(--hiink)}
.surat{background:#fff;color:#000;padding:40px 48px;font:13px/1.55 "Times New Roman",serif;border-radius:2px;max-width:720px;margin:auto}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}.row2{grid-template-columns:1fr}.top{padding-left:40px;flex-wrap:wrap}.top h1{font-size:28px}main{padding-left:40px;background-position:-16px 0}.sholat{grid-template-columns:repeat(3,1fr)}}
@media print{.shell,#toast,.modal{display:none!important}}

<body>
<div id="setup" hidden>
  <div class="logo">K</div><h2>Pengaturan awal (sekali saja)</h2>
  <p style="color:var(--soft)">Tempel konfigurasi Web app dari Firebase Console (Project settings &gt; Your apps &gt; Web &gt; firebaseConfig).</p>
  <textarea id="cfg" rows="8" style="font:12px monospace" placeholder='apiKey: "...", authDomain: "...", projectId: "...", appId: "..."'></textarea>
  <div id="cfgpesan" style="color:var(--red);min-height:22px"></div>
  <button id="cfgsimpan">Simpan dan mulai</button>
</div>
<div id="login" hidden>
  <div class="logo">K</div>
  <h2 style="margin:14px 0 2px">KKN Al-Mushlih 2027</h2>
  <p style="color:var(--mut);margin:0 0 8px">Masuk dengan akun yang sama seperti di HP</p>
  <label>NIM</label><input id="nim" autocomplete="username">
  <label>Kata sandi</label><input id="sandi" type="password" autocomplete="current-password">
  <div id="pesan" style="color:var(--red);min-height:22px;margin-top:6px"></div>
  <button id="masuk" style="width:100%">Masuk</button>
</div>
<div id="app" class="shell" hidden>
  <aside><div class="brand"><div class="logo">K</div><div><b>KKN Al-Mushlih</b><small id="desa"></small></div></div><div id="menu"></div>
    <div style="margin-top:auto;padding:12px"><div id="siapa" style="color:var(--mut);font-size:12px;margin:0 6px 8px"></div>
    <button class="sek" id="tema" style="width:100%;margin-bottom:6px">Tema: otomatis</button>
    <button class="sek" id="gantiCfg" style="width:100%;margin-bottom:6px">Konfigurasi Firebase</button>
    <button class="sek" id="keluar" style="width:100%">Keluar</button></div></aside>
  <div class="kanan"><div class="top"><h1 id="judul"></h1><input id="cari" placeholder="Cari di semua data… (Ctrl+K)"></div><main id="isi"></main></div>
</div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp = (n) => "Rp " + (Number(n) || 0).toLocaleString("id-ID");
const tgl = (ms) => ms ? new Date(ms).toLocaleDateString("id-ID", {day:"2-digit",month:"short",year:"numeric"}) : "-";
const tglJam = (ms) => ms ? new Date(ms).toLocaleString("id-ID", {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "-";
const awalHari = (ms) => { const d = new Date(ms); d.setHours(0,0,0,0); return +d; };
const kePengguna = (inp) => inp ? +new Date(inp + "T00:00:00") : 0;
const keInput = (ms) => ms ? new Date(ms - new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,10) : "";
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2600); }

/* ---------- tema ---------- */
const TEMA = ["auto","terang","gelap"];
let temaIdx = Math.max(0, TEMA.indexOf(localStorage.getItem("kkn_tema") || "auto"));
function pasangTema() { document.documentElement.dataset.tema = TEMA[temaIdx] === "terang" ? "terang" : TEMA[temaIdx] === "gelap" ? "gelap" : "auto"; const t = $("tema"); if (t) t.textContent = "Tema: " + ["otomatis","terang","gelap"][temaIdx]; }
pasangTema();

/* ---------- konfigurasi ---------- */
function bacaCfg() {
  try { const t = localStorage.getItem("kkn_firebase"); if (t) return JSON.parse(t); } catch (e) {}
  const c = window.KKN_FIREBASE; return c && c.apiKey && !c.apiKey.startsWith("ISI_") ? c : null;
}
const CFG = bacaCfg();
if (!CFG) {
  $("setup").hidden = false;
  $("cfgsimpan").onclick = () => {
    const t = $("cfg").value, o = {};
    for (const k of ["apiKey","authDomain","projectId","appId","storageBucket","messagingSenderId"]) {
      const m = t.match(new RegExp(k + '\\s*["\']?\\s*[:=]\\s*["\']([^"\']+)["\']')); if (m) o[k] = m[1];
    }
    if (!o.apiKey || !o.projectId) { $("cfgpesan").textContent = "apiKey dan projectId tidak ditemukan. Salin ulang konfigurasinya."; return; }
    if (!o.authDomain) o.authDomain = o.projectId + ".firebaseapp.com";
    localStorage.setItem("kkn_firebase", JSON.stringify(o)); location.reload();
  };
  throw new Error("menunggu konfigurasi");
}
firebase.initializeApp(CFG);
const auth = firebase.auth(), db = firebase.firestore();
// Mode offline: data terakhir tetap bisa dibaca, dan perubahan dikirim otomatis saat internet kembali.
try { db.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch (e) {}

/* Pilihan (select/filter) langsung diterapkan: lepas fokus lebih dulu supaya penyegaran halaman tidak dilewati. */
document.addEventListener("change", (e) => { if (e.target && e.target.tagName === "SELECT" && e.target.closest("#isi")) e.target.blur(); }, true);

/* ---------- state ---------- */
let me = null, desaId = "", admin = false, data = {}, halaman = "beranda", kata = "", saring = {};
const unsub = [];
const DESA = ["anggota","absensi","proker","surat","inventaris","nota","bukti","riwayat","ajar"];
const GLOBAL = ["tugas","pengumuman","polling","kas","jurnal_bersama"];
const dk = (n) => db.collection("desa").doc(desaId).collection(n);
const aktif = (n) => (data[n] || []).filter((x) => !x.dihapus);

/* ---------- tulis (data + riwayat atomik, sama dengan aplikasi HP) ---------- */
const jejakBaru = (t) => ({dibuatOleh: me.uid, dibuatOlehNama: me.nama, dibuatPada: t, diubahOleh: me.uid, diubahOlehNama: me.nama, diubahPada: t});
const jejakUbah = (t) => ({diubahOleh: me.uid, diubahOlehNama: me.nama, diubahPada: t});
async function tulis(tabel, aksi, ringkas, ref, isi, baru) {
  const t = Date.now(), b = db.batch();
  if (baru) b.set(ref, {...isi, ...jejakBaru(t)}); else b.update(ref, {...isi, ...jejakUbah(t)});
  b.set(dk("riwayat").doc(), {tabel, aksi, targetId: ref.id, ringkas: String(ringkas).slice(0,160), oleh: me.uid, olehNama: me.nama, waktu: t});
  await b.commit();
}
async function coba(fn, ok) { try {
    const lambat = Symbol(), h = await Promise.race([fn(), new Promise((r) => setTimeout(() => r(lambat), 6000))]);
    if (h === lambat) { toast("Belum ada internet: tersimpan di PC ini dan dikirim otomatis nanti."); return; }
    if (ok) toast(ok); } catch (e) { toast(e.code === "permission-denied" ? "Ditolak server (aturan Firestore / akun diblokir)." : "Gagal: " + e.message); } }

/* ---------- foto: kompres ke JPEG base64 (sama dengan HP, maks ~180 KB) ---------- */
function kompres(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let maks = 1280, q = 0.8;
      for (let i = 0; i < 8; i++) {
        const s = Math.min(1, maks / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const b64 = c.toDataURL("image/jpeg", q).split(",")[1];
        if (b64.length * 0.75 <= 180000) { URL.revokeObjectURL(url); return res(b64); }
        q -= 0.1; if (q < 0.4) { q = 0.7; maks = Math.round(maks * 0.75); }
      }
      rej(new Error("Foto terlalu besar"));
    };
    img.onerror = () => rej(new Error("File bukan gambar")); img.src = url;
  });
}
const src = (b) => "data:image/jpeg;base64," + b;

/* ---------- modal ---------- */
function modal(html, ikat) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="dlg">${html}</div>`;
  m.onmousedown = (e) => { if (e.target === m) tutup(); }; document.body.appendChild(m);
  const tutup = () => { m.remove(); gambar(); }; m.tutup = tutup; if (ikat) ikat(m, tutup); return m;
}
function formModal(judul, isi, onSimpan, tombol = "Simpan") {
  modal(`<h2>${judul}</h2>${isi}<div class="aksi"><button class="sek" data-x>Batal</button><button data-ok>${tombol}</button></div>`, (m, tutup) => {
    m.querySelector("[data-x]").onclick = tutup;
    m.querySelector("[data-ok]").onclick = async () => { const ok = await onSimpan(m); if (ok !== false) tutup(); };
    const f = m.querySelector("input,textarea,select"); if (f) f.focus();
  });
}
const v = (m, n) => m.querySelector(`[name=${n}]`).value;
function lihatFoto(b) { modal(`<img src="${src(b)}" style="width:100%;border-radius:12px"><div class="aksi"><button class="sek" data-x>Tutup</button></div>`, (m, t) => m.querySelector("[data-x]").onclick = t); }
const konfirm = (teks, fn) => formModal("Konfirmasi", `<p>${esc(teks)}</p>`, async () => { await fn(); }, "Ya, lanjutkan");

/* ---------- login ---------- */
async function masuk() {
  $("pesan").textContent = "";
  const nim = $("nim").value.trim(), sandi = $("sandi").value;
  if (!nim || !sandi) { $("pesan").textContent = "Isi NIM dan kata sandi."; return; }
  try {
    const idx = await db.collection("nim_index").doc(nim).get();
    if (!idx.exists || !idx.data().email) { $("pesan").textContent = "NIM tidak ditemukan."; return; }
    await auth.signInWithEmailAndPassword(idx.data().email, sandi);
  } catch (e) { $("pesan").textContent = "Gagal masuk: periksa NIM dan kata sandi."; }
}
$("masuk").onclick = masuk; $("sandi").onkeydown = (e) => { if (e.key === "Enter") masuk(); };
$("keluar").onclick = () => auth.signOut();
$("tema").onclick = () => { temaIdx = (temaIdx + 1) % 3; localStorage.setItem("kkn_tema", TEMA[temaIdx]); pasangTema(); };
$("gantiCfg").onclick = () => konfirm("Ganti konfigurasi Firebase? Kamu akan keluar.", () => { localStorage.removeItem("kkn_firebase"); auth.signOut().finally(() => location.reload()); });

auth.onAuthStateChanged(async (u) => {
  unsub.splice(0).forEach((f) => f()); data = {};
  if (!u) { $("app").hidden = true; $("login").hidden = false; return; }
  const p = await db.collection("users").doc(u.uid).get();
  const prof = p.exists ? p.data() : null;
  if (!prof || prof.akunDiblokir || !prof.desaId) {
    $("pesan").textContent = prof && prof.akunDiblokir ? "Akun diblokir." : "Akun belum punya desa. Buka aplikasi HP sekali dulu."; await auth.signOut(); return;
  }
  desaId = prof.desaId; me = {uid: u.uid, nama: prof.namaLengkap || "Pengguna", desa: prof.desa || desaId, peran: prof.peran, prof};
  try { db.collection("users").doc(u.uid).update({terakhirAktifMillis: Date.now()}); } catch (e) {}
  try { admin = (await db.collection("admins").doc(u.uid).get()).exists; } catch (e) { admin = false; }
  $("desa").textContent = me.desa; $("siapa").textContent = me.nama + (admin ? " · admin" : "");
  $("login").hidden = true; $("app").hidden = false;
  const dengar = (ref, n) => unsub.push(ref.onSnapshot((s) => { data[n] = s.docs.map((d) => ({id: d.id, ...d.data()})); gambar(); }, () => { data[n] = []; gambar(); }));
  DESA.forEach((n) => dengar(dk(n), n)); GLOBAL.forEach((n) => dengar(db.collection(n), n));
  unsub.push(db.collection("users").where("desaId", "==", desaId).onSnapshot((s) => { data.users = s.docs.map((d) => ({id: d.id, ...d.data()})); }, () => {}));
  bangunMenu(); gambar();
});

/* ---------- menu ---------- */
const MENU = [
  ["", [["beranda","🏠","Beranda"]]],
  ["Sekretaris", [["absensi","✅","Absensi"],["anggota","👥","Anggota"],["surat","✉️","Surat Masuk/Keluar"],["proker","📋","Program Kerja"],["inventaris","📦","Inventaris Posko"],["tugas","🗓️","Tugas"],["dokumen","📄","Dokumen & PDF"]]],
  ["Bendahara", [["nota","🧾","Arsip Nota"],["rekon","⚖️","Rekonsiliasi"],["kas","💰","Kas Kelompok"]]],
  ["Media", [["jurnal","📖","Jurnal & Notulen"]]],
  ["Pendidikan", [["ajar","🎓","Jadwal Mengajar"]]],
  ["Umum", [["pengumuman","📣","Pengumuman"],["polling","📊","Polling"],["sholat","🕌","Waktu Sholat"]]],
  ["Lainnya", [["riwayat","🕘","Riwayat Perubahan"]]],
];
const JUDUL = {}; MENU.forEach(([, m]) => m.forEach((x) => JUDUL[x[0]] = x[2])); JUDUL.cari = "Hasil Pencarian";
function bangunMenu() {
  $("menu").innerHTML = MENU.map(([g, items]) => (g ? `<div class="grp">${g}</div>` : "") + items.filter((x) => x[4] !== "admin" || (typeof BOLEH_KENDALI === "function" && BOLEH_KENDALI())).map(([k, ik, n, s]) =>
    `<button class="mn ${halaman===k?"on":""} ${s?"off":""}" data-k="${k}">${n}${s?`<span class="seg">segera</span>`:""}</button>`).join("")).join("");
  $("menu").querySelectorAll(".mn:not(.off)").forEach((b) => b.onclick = () => { halaman = b.dataset.k; kata = ""; $("cari").value = ""; saring = {}; bangunMenu(); gambar(); });
}
$("cari").oninput = (e) => { kata = e.target.value.trim(); if (kata.length >= 2) { halaman = "cari"; } else if (halaman === "cari") halaman = "beranda"; bangunMenu(); gambar(); };
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("cari").focus(); } });

/* ---------- gambar halaman ---------- */
function gambar() {
  if (!desaId || $("app").hidden) return;
  if (document.querySelector(".modal") && !gambar.paksa) return;
  const ae = document.activeElement; if (ae && $("isi").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "checkbox" && !gambar.paksa) return;
  $("judul").textContent = JUDUL[halaman] || "";
  const f = HAL[halaman] || HAL.beranda;
  const y = $("isi").scrollTop; $("isi").innerHTML = ""; f($("isi")); try { perkayaTabel($("isi")); } catch (e) {} $("isi").scrollTop = y;
}
function tabel(kolom, baris, aksi) {
  if (!baris.length) return `<div class="kosong">Belum ada data.</div>`;
  return `<div class="wrap"><table><thead><tr>${kolom.map((c) => `<th>${c[0]}</th>`).join("")}${aksi?"<th></th>":""}</tr></thead><tbody>${baris.map((r, i) => `<tr>${kolom.map((c) => `<td>${c[1](r)}</td>`).join("")}${aksi?`<td style="text-align:right;white-space:nowrap">${aksi(r, i)}</td>`:""}</tr>`).join("")}</tbody></table></div>`;
}
function csv(nama, kolom, baris) {
  const q = (s) => '"' + String(s ?? "").replace(/"/g, '""').replace(/<[^>]+>/g, "") + '"';
  const t = [kolom.map((c) => q(c[0])).join(",")].concat(baris.map((r) => kolom.map((c) => q(c[1](r))).join(","))).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + t], {type: "text/csv;charset=utf-8"})); a.download = `kkn-${nama}.csv`; a.click();
}
const gabung = (...a) => a.join("");
function tombolCsv(nama, kolom, baris) { return `<button class="sek" data-csv>Ekspor CSV</button>`; }
function ikatCsv(el, nama, kolom, baris) { const b = el.querySelector("[data-csv]"); if (b) b.onclick = () => csv(nama, kolom, baris); }
const urutBaru = (a) => a.slice().sort((x, y) => (y.tanggalMillis || y.waktu || y.diubahPada || 0) - (x.tanggalMillis || x.waktu || x.diubahPada || 0));
const statusTag = (s) => `<span class="tag ${s==="SELESAI"?"ok":s==="BERJALAN"?"warn":s==="BATAL"?"bad":""}">${esc(({BELUM_MULAI:"Belum mulai",BERJALAN:"Berjalan",SELESAI:"Selesai",BATAL:"Batal"})[s]||s)}</span>`;

/* ---------- waktu sholat (rumus yang sama dengan HP) ---------- */
const KOTA = {Jakarta:[-6.2088,106.8456],Yogyakarta:[-7.7956,110.3695],Surabaya:[-7.2575,112.7521]};
const kotaPilihan = () => { const k = localStorage.getItem("kkn_kota_sholat"); return KOTA[k] ? k : "Yogyakarta"; };
function sholat(lin, buj, zona, T, B, H) {
  const R = Math.PI / 180, D = 180 / Math.PI, fix = (a, b) => a - b * Math.floor(a / b);
  let y = T, m = B; if (m <= 2) { y--; m += 12; } const a = Math.floor(y / 100), bb = 2 - a + Math.floor(a / 4);
  const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + H + bb - 1524.5, d = jd + 0.5 - 2451545;
  const g = fix(357.529 + 0.98560028 * d, 360), q = fix(280.459 + 0.98564736 * d, 360);
  const l = fix(q + 1.915 * Math.sin(g * R) + 0.02 * Math.sin(2 * g * R), 360), e = 23.439 - 3.6e-7 * d;
  const ra = fix(Math.atan2(Math.cos(e * R) * Math.sin(l * R), Math.cos(l * R)) * D / 15, 24), eqt = q / 15 - ra, dek = Math.asin(Math.sin(e * R) * Math.sin(l * R)) * D;
  const dz = 12 + zona - buj / 15 - eqt;
  const sel = (s) => { const x = (-Math.sin(s * R) - Math.sin(dek * R) * Math.sin(lin * R)) / (Math.cos(dek * R) * Math.cos(lin * R)); return Math.acos(Math.max(-1, Math.min(1, x))) * D / 15; };
  const ash = () => sel(-Math.atan(1 / (1 + Math.tan(Math.abs(lin - dek) * R))) * D), ih = 2 / 60;
  return [["Subuh", dz - sel(20) + ih], ["Terbit", dz - sel(0.833) - ih], ["Dzuhur", dz + ih], ["Ashar", dz + ash() + ih], ["Maghrib", dz + sel(0.833) + ih], ["Isya", dz + sel(18) + ih]];
}
const jamFmt = (j) => { const t = Math.round((((j % 24) + 24) % 24) * 60) % 1440; return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
function jadwalHariIni(kota) { const n = new Date(), [la, bu] = KOTA[kota] || KOTA.Yogyakarta; return sholat(la, bu, 7, n.getFullYear(), n.getMonth() + 1, n.getDate()); }

/* ---------- halaman ---------- */
const HAL = {};

HAL.beranda = (el) => {
  const pr = aktif("proker").filter((p) => p.status !== "BATAL"), sel = pr.filter((p) => p.status === "SELESAI").length, persen = pr.length ? Math.round(sel * 100 / pr.length) : 0;
  const ang = aktif("anggota").filter((a) => a.aktif !== false), hari = awalHari(Date.now());
  const hadir = aktif("absensi").filter((a) => a.tanggalMillis === hari && a.hadir).length;
  const kasM = aktif("kas").filter((k) => k.masuk !== false).reduce((s, k) => s + (k.jumlah || 0), 0), kasK = aktif("kas").filter((k) => k.masuk === false).reduce((s, k) => s + (k.jumlah || 0), 0);
  const j = jadwalHariIni(kotaPilihan()), now = new Date().getHours() + new Date().getMinutes() / 60;
  const urut = j.filter((x) => x[0] !== "Terbit"), next = urut.find((x) => x[1] > now) || urut[0];
  const perhatian = [];
  const nowMs = Date.now();

const stAbs = (x) => x.status || (x.hadir ? "HADIR" : "ALPA");
function rekapAbsensi(dariMs) {
  return aktif("anggota").sort((a, b) => a.nama.localeCompare(b.nama)).map((a) => {
    const l = aktif("absensi").filter((x) => x.anggotaId === a.id && x.tanggalMillis >= dariMs), c = (s) => l.filter((x) => stAbs(x) === s).length;
    return {n: a.nama, d: a.divisi || "", h: c("HADIR"), i: c("IZIN"), s: c("SAKIT"), a: c("ALPA"), tot: l.length};
  }).filter((r) => r.tot > 0 || !dariMs);
}
const pct = (r) => (r.tot ? Math.round(r.h * 100 / r.tot) : 0) + "%";
const KOL_REKAP = [["Nama", (r) => esc(r.n)], ["Hadir", (r) => r.h], ["Izin", (r) => r.i], ["Sakit", (r) => r.s], ["Alpa", (r) => r.a], ["%", pct]];
const KOL_REKAP_CSV = [["Nama", (r) => r.n], ["Hadir", (r) => r.h], ["Izin", (r) => r.i], ["Sakit", (r) => r.s], ["Alpa", (r) => r.a], ["Persen hadir", pct]];
function pdfRekapBulan(fmt) {
  const d = new Date(), awal = new Date(d.getFullYear(), d.getMonth(), 1).getTime(), nm = d.toLocaleDateString("id-ID", {month: "long", year: "numeric"});
  const r = rekapAbsensi(awal);
  if (!r.length) { toast("Belum ada data absensi bulan ini"); return; }
  simpanDok(dokPdfHtml("Rekap Absensi " + nm, "Desa " + me.desa, ["Nama", "Hadir", "Izin", "Sakit", "Alpa", "Persen hadir"], r.map((x) => [x.n, x.h, x.i, x.s, x.a, pct(x)])), `Rekap_Absensi_${nm.replace(/\W+/g, "_")}.pdf`, fmt);
}

/* ---------- PDF umum (kop + tabel) ---------- */
function dokPdfHtml(judul, sub, kepala, baris, tambahan = "") {
  const e = (s) => esc(s);
  return `<!doctype html><meta charset="utf-8"><style>@page{size:A4 landscape;margin:16mm}body{font:12px/1.45 "Segoe UI",Arial,sans-serif;color:#000}.kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:12px}.kop b{font-size:16px;display:block}h2{margin:10px 0 2px;font-size:15px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #444;padding:5px 7px;text-align:left;vertical-align:top}th{background:#e9e9f2}.ttd{margin-top:30px;text-align:right}small{color:#444}</style>
  <div class="kop"><b>KELOMPOK KKN AL-MUSHLIH 2027</b>Desa ${e(me.desa)}</div><h2>${e(judul)}</h2><small>${e(sub)} · dicetak ${hariIniStr()}</small>${tambahan}
  <table><thead><tr>${kepala.map((k) => `<th>${e(k)}</th>`).join("")}</tr></thead><tbody>${baris.map((r) => `<tr>${r.map((c) => `<td>${e(c)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${kepala.length}">Tidak ada data.</td></tr>`}</tbody></table>
  <div class="ttd">${e(me.desa)}, ${hariIniStr()}<br>Sekretaris<br><br><br><br>${e(me.nama)}</div>`;
}
/* ---------- Word (.docx) tanpa library: zip "stored" + CRC32 ---------- */
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u) => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipSimpan(berkas, mime) {

  el.querySelector("[data-muat]").onclick = () => coba(async () => {
    const o = {id: $("pdSel").value}; saring.pd = o.id;
    for (const n of ["anggota", "absensi", "proker", "surat", "inventaris", "nota"]) o[n] = (await db.collection("desa").doc(o.id).collection(n).get()).docs.map((d) => ({id: d.id, ...d.data()}));
    data.pdData = o; gambar();
  });
};

/* ---------- Pengingat (notifikasi desktop, diulang sampai dibuka) ---------- */
const pengingatAktif = () => localStorage.getItem("kkn_pengingat") !== "0";
function kumpulPengingat() {
  if (!me) return []; const L = [], n = Date.now(), hari = awalHari(n), kode = new Date().toISOString().slice(0, 10);
  aktif("tugas").filter((t) => t.untukUid === me.uid && !t.selesai && (!t.deadlineMillis || t.deadlineMillis < n + 864e5)).forEach((t) => L.push(["tugas:" + t.id, "Tugas: " + t.judul]));
  aktif("proker").filter((p) => p.status !== "SELESAI" && p.status !== "BATAL").forEach((p) => { if (p.mulaiMillis >= hari && p.mulaiMillis < hari + 2 * 864e5) L.push(["proker-mulai:" + p.id + ":" + kode, "Proker dimulai: " + p.namaProker]); else if (p.selesaiMillis && p.selesaiMillis < hari) L.push(["proker-lewat:" + p.id, "Proker lewat jadwal: " + p.namaProker]); });
  if (new Date().getHours() >= 16 && aktif("anggota").some((a) => a.aktif !== false) && !aktif("absensi").some((a) => a.tanggalMillis === hari)) L.push(["absen:" + kode, "Absensi hari ini belum dicatat"]);
  aktif("pengumuman").filter((p) => !(p.dibacaOleh || []).includes(me.uid) && p.tanggalMillis > n - 3 * 864e5).forEach((p) => L.push(["pengumuman:" + p.id, "Pengumuman: " + (p.judul || "(tanpa judul)")]));
  const sudah = JSON.parse(localStorage.getItem("kkn_dilihat") || "[]"); return L.filter((x) => !sudah.includes(x[0]));
}
function tandaiDilihat(kunci) { const s = JSON.parse(localStorage.getItem("kkn_dilihat") || "[]"); localStorage.setItem("kkn_dilihat", JSON.stringify(s.concat(kunci).slice(-300))); }
setInterval(() => {
  if (!me || $("app").hidden || !pengingatAktif() || !("Notification" in window) || Notification.permission !== "granted") return;
  const L = kumpulPengingat(), terakhir = +localStorage.getItem("kkn_notif_terakhir") || 0;
  if (!L.length || Date.now() - terakhir < 15 * 60 * 1000) return;
  localStorage.setItem("kkn_notif_terakhir", Date.now());
  const n = new Notification(L.length + " pengingat belum dibuka", {body: L.slice(0, 4).map((x) => x[1]).join("\n"), requireInteraction: true});
  n.onclick = () => { tandaiDilihat(L.map((x) => x[0])); window.focus(); halaman = "beranda"; bangunMenu(); gambar(); n.close(); };
}, 60 * 1000);
if ("Notification" in window && Notification.permission === "default" && pengingatAktif()) setTimeout(() => Notification.requestPermission(), 4000);

/* ---------- Waktu sholat: segarkan tiap menit + pengingat islami 10 menit sebelum adzan ---------- */
const PESAN_ISLAMI = ["Sesungguhnya sholat itu adalah kewajiban yang ditentukan waktunya atas orang-orang beriman. (QS. An-Nisa: 103)", "Perkara pertama yang dihisab dari seorang hamba pada hari kiamat adalah sholatnya. (HR. At-Tirmidzi)", "Jagalah sholat-sholatmu dan sholat wustha, dan berdirilah karena Allah dengan khusyuk. (QS. Al-Baqarah: 238)", "Sholat adalah tiang agama. (HR. Al-Baihaqi)", "Maka dirikanlah sholat untuk mengingat-Ku. (QS. Thaha: 14)", "Sholat berjamaah lebih utama 27 derajat daripada sholat sendirian. (HR. Bukhari dan Muslim)", "Rehatkan kami dengan sholat, wahai Bilal. (HR. Abu Dawud)"];
const sholatAktif = () => localStorage.getItem("kkn_sholat_ingat") !== "0";
function cekIngatSholat() {
  if (!me || !sholatAktif() || !("Notification" in window) || Notification.permission !== "granted") return;
  const n = new Date(), hariKode = n.toISOString().slice(0, 10), now = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
  jadwalHariIni(kotaPilihan()).filter((x) => x[0] !== "Terbit").forEach((x) => {
    const adzan = Math.round(x[1] * 60), sisa = adzan - now, kunci = "kkn_ing_" + hariKode + x[0];
    if (sisa > 0 && sisa <= 10 && !localStorage.getItem(kunci)) {
      localStorage.setItem(kunci, "1");
      new Notification(`${Math.max(1, Math.round(sisa))} menit lagi adzan ${x[0]} (${jamFmt(x[1])})`, {body: "Bersiap wudhu dan menunaikan sholat tepat waktu.\n" + PESAN_ISLAMI[Math.floor(Math.random() * PESAN_ISLAMI.length)], requireInteraction: true});
    }
  });
  Object.keys(localStorage).filter((k) => k.startsWith("kkn_ing_") && !k.startsWith("kkn_ing_" + hariKode)).forEach((k) => localStorage.removeItem(k));
}
setInterval(() => { cekIngatSholat(); if ((halaman === "sholat" || halaman === "beranda") && me) gambar(); }, 30000);
setTimeout(cekIngatSholat, 5000);

/* ---------- Filter & urutkan otomatis untuk tabel yang datanya banyak ---------- */
const BLN = {jan:0,feb:1,mar:2,apr:3,mei:4,jun:5,jul:6,agu:7,sep:8,okt:9,nov:10,des:11};
function kunciUrut(t) {
  t = String(t).trim(); const m = t.match(/^(\d{1,2})\s+([A-Za-z]{3})\.?\s*(\d{4})?/);
  if (m && BLN[m[2].toLowerCase()] !== undefined) return new Date(m[3] || new Date().getFullYear(), BLN[m[2].toLowerCase()], +m[1]).getTime();
  const n = t.replace(/^Rp\s*/i, "").replace(/\./g, "").replace(",", ".").replace(/%$/, "");
  if (n !== "" && !isNaN(n)) return +n;
  return t.toLowerCase();
}
function perkayaTabel(root) {
  root.querySelectorAll(".wrap").forEach((w, ix) => {
    const tb = w.querySelector("table"); if (!tb || w.dataset.tb || w.closest(".modal")) return;
    const baris = [...tb.tBodies[0].rows]; if (baris.length < 6) return;
    w.dataset.tb = "1";
    const kep = [...tb.tHead.rows[0].cells].map((c) => c.textContent.trim()), kunci = halaman + ix, S = (saring.tb = saring.tb || {}), st = (S[kunci] = S[kunci] || {q: "", u: "", arah: 1, fk: "", fv: ""});
    const idx = kep.map((k, i) => i).filter((i) => kep[i]);
    const bar = document.createElement("div"); bar.className = "bar"; bar.style.marginBottom = "8px";
    bar.innerHTML = `<input class="tq" placeholder="Saring: ketik kata…" value="${esc(st.q)}"><select class="tu"><option value="">Urutkan berdasarkan…</option>${idx.map((i) => `<option value="${i}" ${String(st.u) === String(i) ? "selected" : ""}>${esc(kep[i])}</option>`).join("")}</select><button class="sek kecil ta" title="Balik urutan">${st.arah > 0 ? "A→Z ↑" : "Z→A ↓"}</button><select class="tf"><option value="">Filter berdasarkan…</option>${idx.map((i) => `<option value="${i}" ${String(st.fk) === String(i) ? "selected" : ""}>${esc(kep[i])}</option>`).join("")}</select><select class="tv" ${st.fk === "" ? "hidden" : ""}></select><span class="tag tc"></span>`;
    w.before(bar);
    const isiNilai = () => { const sel = bar.querySelector(".tv"); if (st.fk === "") { sel.hidden = true; return; } const nilai = [...new Set(baris.map((r) => r.cells[+st.fk].textContent.trim()))].filter(Boolean).sort(); sel.hidden = false; sel.innerHTML = `<option value="">Semua nilai</option>` + nilai.slice(0, 80).map((n) => `<option ${n === st.fv ? "selected" : ""}>${esc(n)}</option>`).join(""); };
    const terap = () => {
      const q = st.q.toLowerCase(); let tampil = 0;
      baris.forEach((r) => { const ok = (!q || r.textContent.toLowerCase().includes(q)) && (st.fk === "" || !st.fv || r.cells[+st.fk].textContent.trim() === st.fv); r.hidden = !ok; if (ok) tampil++; });
      if (st.u !== "") { const u = +st.u, d = [...baris].sort((a, b) => { const x = kunciUrut(a.cells[u].textContent), y = kunciUrut(b.cells[u].textContent); return (x < y ? -1 : x > y ? 1 : 0) * st.arah; }); d.forEach((r) => tb.tBodies[0].appendChild(r)); }
      bar.querySelector(".tc").textContent = tampil + " dari " + baris.length + " data";
      bar.querySelector(".ta").textContent = st.arah > 0 ? "A→Z ↑" : "Z→A ↓";
    };
    bar.querySelector(".tq").oninput = (e) => { st.q = e.target.value; terap(); };
    bar.querySelector(".tu").onchange = (e) => { st.u = e.target.value; terap(); };
    bar.querySelector(".ta").onclick = () => { st.arah *= -1; terap(); };
    bar.querySelector(".tf").onchange = (e) => { st.fk = e.target.value; st.fv = ""; isiNilai(); terap(); };
    bar.querySelector(".tv").onchange = (e) => { st.fv = e.target.value; terap(); };
    isiNilai(); terap();
  });
}

/* ---------- Penanda offline ---------- */
function penandaOffline() {
  let b = document.getElementById("bannerOffline");
  if (navigator.onLine) { if (b) b.remove(); return; }
  if (b || !document.querySelector(".kanan")) return;
  b = document.createElement("div"); b.id = "bannerOffline";
  b.style.cssText = "background:var(--red);color:#fff;padding:6px 26px;font-weight:600";
  b.textContent = "Tidak ada internet. Data terakhir tetap bisa dibuka; perubahan akan dikirim otomatis saat tersambung.";
  document.querySelector(".kanan").prepend(b);
}
addEventListener("online", penandaOffline); addEventListener("offline", penandaOffline); setInterval(penandaOffline, 5000);

/* ---------- Pembaruan aplikasi PC ---------- */
async function cekPembaruan(manual) {
  const v = await versiApp(), t = $("vtxt");
  if (!v) { if (t) t.textContent = "Versi web: selalu yang terbaru."; return; }
  try {
    const r = await (await fetch("https://api.github.com/repos/ALK-99/Aplikasi-KKN-v1/releases?per_page=30")).json();
    const rel = r.find((x) => !x.draft && /^pc-v\d/.test(x.tag_name) && (x.assets || []).some((a) => /Setup.*\.exe$/i.test(a.name)));
    const baru = rel ? rel.tag_name.replace("pc-v", "") : "", lebih = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
    if (rel && lebih(baru, v)) {
      const url = rel.assets.find((a) => /Setup.*\.exe$/i.test(a.name)).browser_download_url;
      if (t) t.innerHTML = `Versi terpasang ${esc(v)}. <b>Tersedia ${esc(baru)}.</b> <button class="kecil" data-u>Unduh</button>`;
      const pasang = async (tombol) => { if (!(window.kkn && window.kkn.pasangPembaruan)) return bukaLuar(url); tombol.disabled = true; tombol.textContent = "Mengunduh…"; try { await window.kkn.pasangPembaruan(url); toast("Pemasang dibuka. Aplikasi akan tertutup."); } catch (e) { tombol.disabled = false; tombol.textContent = "Coba lagi"; toast("Gagal mengunduh: " + e.message); } };
      if (t) { const tb = t.querySelector("[data-u]"); tb.textContent = "Pasang sekarang"; tb.onclick = () => pasang(tb); }
      if (!$("bannerUpdate")) { const b = document.createElement("div"); b.id = "bannerUpdate"; b.style.cssText = "background:var(--gold);color:#000;padding:8px 26px;font-weight:600;display:flex;gap:12px;align-items:center"; b.innerHTML = `Pembaruan ${esc(baru)} tersedia <button class="kecil" style="background:#000">Unduh</button>`; b.querySelector("button").textContent = "Pasang sekarang"; b.querySelector("button").onclick = (ev) => pasang(ev.target); document.querySelector(".kanan").prepend(b); }
    } else if (t) t.textContent = `Versi terpasang ${v}. Sudah yang terbaru.`;
  } catch (e) { if (t) t.textContent = manual ? "Gagal memeriksa. Periksa internet." : `Versi terpasang ${v}.`; }
}
setTimeout(() => { if (me) cekPembaruan(false); }, 6000);
