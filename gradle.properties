# Dikecilkan dari default (biasanya 2-4g) karena laptop dev RAM 8GB total
# dan sering berbagi memori dengan VM lain. Mencegah build gagal karena
# kehabisan memori / laptop freeze saat Gradle daemon jalan.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
